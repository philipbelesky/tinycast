name: Tinycast
options:
  bundleIdPrefix: com.tinycast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # Fork-local: upstream signs with the "Tinycast Self-Signed" identity from docs/signing.md.
    # Either way the identity must stay *stable*, or macOS forgets the Accessibility grant.
    DEVELOPMENT_TEAM: CNPCA4RAWZ
    CODE_SIGN_STYLE: Automatic
    # Debug keeps the development profile: only what ships has to run on a Mac nobody registered.
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      # A Developer ID profile carries no ProvisionedDevices, so a shipped build runs on any Mac
      # instead of the two the development profile names. iCloud is a DEVELOPER_ID capability, so
      # the KVS entitlement — and settings sync with it — survives the switch. FORK.md divergence 1.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Tinycast:
    type: application
    platform: macOS
    sources:
      - path: Tinycast
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    settings:
      base:
        # Fork-local ids: com.tinycast.app is another team's App ID, which iCloud provisioning needs.
        PRODUCT_BUNDLE_IDENTIFIER: com.belesky.tinycast
        INFOPLIST_FILE: Tinycast/Info.plist
        # Fork-local: upstream's entitlements plus the iCloud KVS grant. FORK.md divergence 10.
        CODE_SIGN_ENTITLEMENTS: Tinycast/TinycastFork.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: tinycast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, like beta/stable in release.yml: a distinct bundle id means a
        # locally-run build gets its own prefs, caches, TCC grants and login item instead of
        # inheriting — and corrupting — the installed app's state.
        Debug:
          PRODUCT_NAME: Tinycast Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.belesky.tinycast.dev
